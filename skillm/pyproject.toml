[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillm"
version = "0.0.4"
description = "Universal skill registry — reuse Python, Docker, CLI, REST via MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tom Softreck", email = "tom@sapletta.com" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/semcod/skillm"
Repository = "https://github.com/semcod/skillm"
Documentation = "https://github.com/semcod/skillm#readme"
Issues = "https://github.com/semcod/skillm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
