[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli2skillm"
version = "0.0.4"
description = "Shell REPL / exec for skillm DSL"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tom Softreck", email = "tom@sapletta.com" }]
dependencies = [
    "dsl2skillm>=0.0.3",
]

[project.scripts]
cli2skillm = "cli2skillm.cli:main"

[project.urls]
Homepage = "https://github.com/semcod/skillm"
Repository = "https://github.com/semcod/skillm"
Documentation = "https://github.com/semcod/skillm#readme"
Issues = "https://github.com/semcod/skillm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
